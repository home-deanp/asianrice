bind=SUPER+SHIFT,f,spawn,~/.config/mango/screenshot.sh screen

# exit
bind=SUPER,l,quit
bind=SUPER,q,killclient,

# Volume Knob
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle

# switch window focus
bind=ALT,Tab,focusstack,next
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# move window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right

# switch window status
bind=SUPER,g,toggleglobal,
bind=SUPER,Tab,togglejump,
bind=SUPER,a,togglefloating,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
#bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,n,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,n,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,backslash,switch_layout

# tag switch
bind=ALT,Left,viewtoleft,0
#bind=CTRL,Left,viewtoleft_have_client,0
bind=ALT,Right,viewtoright,0
#bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
#mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi


# Monitor rules
allow_tearing = 1
window_rule = confine_pointer:1
# Rotated secondary monitor placed on the left at origin (0,0)
# (Its portrait width occupies 1080 pixels across your desktop space)
monitor_rule=name:^DP-2$,width:1920,height:1080,refresh:60,x:0,y:0,rr:1

# Main 165Hz monitor shifted right by 1080 pixels to sit directly next to it
monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:165,x:1080,y:550,rr:0,primary:1

#Autostarts
exec_once=waybar
exec_once=nvibrant 0 0 0 0 0 1023
#wallpaper
exec_once=awww-daemon &
#screensharing
exec_once=/usr/lib/xdg-desktop-portal-wlr
#Autostart OBS Studio (minimized with replay buffer)
exec_once=sh -c 'rm -rf ~/.config/obs-studio/.sentinel; obs --startreplaybuffer --minimize-to-tray'
#brightness
exec_once=sh -c 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus exec wl-gammarelay-rs run'
#clipboard
exec_once=wl-clip-persist --clipboard regular --reconnect-tries 0 &
exec_once=wl-paste --type text --watch cliphist store &
exec_once=wl-paste --type image --watch cliphist store &
#Notification Daemon (daemond >:))
exec_once=mako

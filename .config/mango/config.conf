# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=2
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=150
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=1
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=0
default_master_factor=0.50
default_master_count=1
tag_num=9
smart_gaps=0
tag_gather=1

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=20
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=0
warp_cursor=0
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=0
xwayland_persistence=1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
mouse_accel_profile=0
mouse_accel_speed=0.0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x000000FF
#border_color=0x5e5c64FF
focus_color=0x5582BFff
urgent_color=0xEB441EFF
drop_color=0x3B528388
split_color=0x3B5283FF
maximized_screen_color=0x111111FF
scratchpad_color=0x888888FF
global_color=0x000000FF
overlay_color=0x000000CC

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:*,layout_name:scroller
# different tiler for 2nd portrait monitor
tag_rule=id:*,monitor_name:DP-2,layout_name:vertical_scroller
#tag_rule=id:2,no_hide:1,monitor_name:DP-2,layout_name:vertical_scroller


# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+SHIFT,r,reload_config

# menu and terminal
# spawns app launcher
bind=SUPER,Space,spawn_shell,pgrep rofi && pkill rofi || rofi -show drun
# spawns terminal foot (foot 🤤)
bind=SUPER,t,spawn,foot  
# spawns file manager
bind=SUPER,e,spawn,thunar
# spawns hardware monitor
bind=CTRL+SHIFT,ESCAPE,spawn,missioncenter
# spawns clipboard
bind=SUPER,v,spawn_shell,pgrep rofi && pkill rofi || ~/.config/rofi/clipboard-menu.sh
# spawns emoji picker
bind=SUPER,period,spawn_shell,pgrep rofi && pkill rofi || ~/.config/rofi/emoji-picker.sh
# spawns calc short for calculator
bind=SUPER,plus,spawn_shell,pgrep rofi && pkill rofi || ~/.config/rofi/rofi-calc.sh
# medal clip that
bind=NONE,F8,spawn,obs-cmd --websocket obsws://localhost:4455 replay save
# screenshot
bind=SUPER+SHIFT,s,spawn,~/.config/mango/screenshot.sh area
bind=SUPER+SHIFT,f,spawn,~/.config/mango/screenshot.sh screen
# lockscreen
bind=SUPER,l,spawn,swaylock
# theme picker
bind=ALT+SHIFT,w,spawn_shell,pgrep rofi && pkill rofi || ~/.config/mango/wallpaper-picker.sh
# accent color if dont like auto theme
bind=ALT+SHIFT,t,spawn_shell,pgrep rofi && pkill rofi || ~/.config/mango/accent-picker.sh

# exit
bind=SUPER+SHIFT,l,quit
bind=SUPER,q,killclient,

# Volume Knob
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle

# switch window focus
#bind=ALT,Tab,focusstack,next
bind=ALT,Tab,switcher,next
bind=ALT+SHIFT,Tab,switcher,prev
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# move window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right

# switch window status
bind=SUPER+SHIFT,t,toggleglobal,
bind=SUPER,Tab,togglejump,
bind=SUPER,a,togglefloating,
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
#bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,n,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,n,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
#bind=ALT,e,set_proportion,1.0
bind=ALT,m,switch_proportion_preset,
scroller_proportion_preset=0.5,1.0
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,backslash,switch_layout
circle_layout=scroller,tile

bind=SUPER,bracketright,setlayout,dwindle
bind=SUPER,bracketleft,setlayout,grid

# tag switch
bind=ALT,Left,viewtoleft,0
#bind=CTRL,Left,viewtoleft_have_client,0
bind=ALT,Right,viewtoright,0
#bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
#mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
#axisbind=SUPER,UP,viewtoleft_have_client
#axisbind=SUPER,DOWN,viewtoright_have_client
#this is so i can scroll through windows instead of workspaces/tags
axisbind=SUPER,UP,focusdir,left
axisbind=SUPER,DOWN,focusdir,right

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_open:zoom,animation_type_close:zoom,layer_name:rofi


# Monitor rules
allow_tearing = 1
window_rule = confine_pointer:1
# Rotated secondary monitor placed on the left at origin (0,0)
# (Its portrait width occupies 1080 pixels across your desktop space)
monitor_rule=name:^DP-2$,width:1920,height:1080,refresh:60,x:0,y:0,rr:1

# Main 165Hz monitor shifted right by 1080 pixels to sit directly next to it
monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:165,x:1080,y:550,rr:0,primary:1

#stops my screen from being lock when fullscreen or in game
idle_inhibit_when_fullscreen=1

#Autostarts
exec_once=waybar
exec_once=nvibrant 0 0 0 0 0 1023
#wallpaper
exec_once=awww-daemon &
#screensharing
exec_once=/usr/lib/xdg-desktop-portal-wlr
#Autostart OBS Studio (minimized with replay buffer)
exec_once=sh -c 'rm -rf ~/.config/obs-studio/.sentinel; obs --startreplaybuffer --minimize-to-tray'
#brightness
exec_once=sh -c 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus exec wl-gammarelay-rs run'
#clipboard
exec_once=wl-clip-persist --clipboard regular --reconnect-tries 0 &
exec_once=wl-paste --type text --watch cliphist store &
exec_once=wl-paste --type image --watch cliphist store &
#Notification Daemon (daemond >:))
exec_once=mako
# so my it'll save electricity when idle by turning off stuff in certain period of times
exec_once=swayidle
# changing themes so i dont get bored of my setup
exec_once=~/.config/mango/theme.sh --restore
# Polkit Authentication
exec_once=xhost +local:root &
exec_once=/usr/lib/xfce-polkit/xfce-polkit &


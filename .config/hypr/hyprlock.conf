# ~/.config/hypr/hyprlock.conf
# Lock screen styled to match your rofi menus: black, #3B5283 blue accent, square corners, Figtree.

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
    # For a blurred copy of your screen instead of plain black, comment out "color" and use:
    # path = screenshot
    # blur_passes = 3
    # blur_size = 6
}

# time
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = Figtree
    position = 0, 140
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(166, 173, 200, 1.0)
    font_size = 22
    font_family = Figtree
    position = 0, 60
    halign = center
    valign = center
}

# password box
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    rounding = 0
    outer_color = rgb(3B5283)
    inner_color = rgba(0, 0, 0, 0.6)
    font_color = rgb(255, 255, 255)
    font_family = Figtree
    check_color = rgb(3B5283)
    fail_color = rgb(E5484D)
    fade_on_empty = false
    placeholder_text = Password
    fail_text = Wrong password
    position = 0, -40
    halign = center
    valign = center
}

# ~/.config/hypr/hypridle.conf
# Idle timeline:   15 min -> lock + screens off      60 min -> suspend (sleep)
# Anything that inhibits idle (a fullscreen game, a video playing in Firefox, Steam) stops it.

general {
    lock_cmd = pidof hyprlock || hyprlock     # what "loginctl lock-session" runs
    before_sleep_cmd = loginctl lock-session  # lock first, so it is already locked when you wake it
    after_sleep_cmd = wlopm --on '*'          # screens back on after waking from sleep
}

# 15 minutes: lock the session
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

# 15 minutes: turn the screens off (any key or mouse movement turns them back on)
listener {
    timeout = 900
    on-timeout = wlopm --off '*'
    on-resume = wlopm --on '*'
}

# 1 hour: sleep
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}

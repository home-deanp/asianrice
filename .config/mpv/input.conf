Ctrl+w      quit                          # File > Exit
n           add chapter 1                 # Navigate > Next Chapter
p           add chapter -1                # Navigate > Previous Chapter
Ctrl+z      add brightness -1             # Video > Decrease Brightness
Ctrl+x      add brightness 1              # Video > Increase Brightness
P           show-progress                 # View > Show Progress
MOUSE_BTN0  cycle pause
Alt+d       script-binding sort-by-date
Alt+n       script-binding sort-by-name

# Optimized shaders for higher-end GPU (using Ctrl+Alt to avoid WM workspace binds):
